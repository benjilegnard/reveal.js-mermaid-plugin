            # reveal.js mermaid plugin

            ---

            ## Flowchart

            ```mermaid
            flowchart LR
              A[Markdown] --> B[Mermaid]
              B --> C[Highlight]
              C --> D((Slides))
            ```

            ---

            ## Sequence diagram

            ```mermaid
            sequenceDiagram
              participant R as Reveal
              participant P as Plugin
              participant M as mermaid
              R->>P: init(deck)
              P->>M: render(id, source)
              M-->>P: svg
              P-->>R: done
            ```

            ---

            ## Class diagram

            ```mermaid
            classDiagram
              class RevealPlugin {
                +id: string
                +init(deck)
              }
              class MermaidPlugin {
                +id: "mermaid"
              }
              RevealPlugin <|-- MermaidPlugin
            ```

            ---

            ## Highlight still works

            ```ts
            const deck = new Reveal({
              plugins: [Markdown, Mermaid, Highlight],
            });
            ```
