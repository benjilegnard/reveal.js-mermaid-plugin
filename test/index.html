            # reveal.js mermaid plugin

            Test deck for [`@benjilegnard/reveal.js-mermaid-plugin`](https://github.com/benjilegnard/reveal.js-mermaid-plugin/#readme)

            Diagrams from the [mermaid demo page](https://mermaid.ai/open-source/intro/),
            styled with the Tokyo Night palette

            ## Highlight still works

            ```ts
            const deck = new Reveal({
              plugins: [Markdown, Mermaid, Highlight],
            });
            ```

            ---

            ## Invalid diagram

            The source stays visible, with a `mermaid-error` class:

            ```mermaid
            flowchart LR
              A -->
            ```

            ---

            ## Installation

            ```sh
            npm i @benjilegnard/reveal.js-mermaid-plugin mermaid reveal.js
            ```

            `mermaid` (>= 10) and `reveal.js` (>= 6) are peer dependencies.

            ---

            ## Usage

            Register the plugin **after** `Markdown` and **before** `Highlight`

            ```ts
            import Reveal from "reveal.js";
            import Markdown from "reveal.js/plugin/markdown";
            import Highlight from "reveal.js/plugin/highlight";
            import Mermaid from "@benjilegnard/reveal.js-mermaid-plugin";

            const deck = new Reveal({
              plugins: [Markdown, Mermaid, Highlight],
            });

            deck.initialize({
              // passed as is to mermaid.initialize()
              mermaid: { theme: "dark" },
            });
            ```

            ---

            ## Usage

            Then write mermaid code blocks in your markdown slides:

            ````md
            ```mermaid
            flowchart LR
              A --> B
            ```
            ````

            More on the [README](https://github.com/benjilegnard/reveal.js-mermaid-plugin/#readme)
